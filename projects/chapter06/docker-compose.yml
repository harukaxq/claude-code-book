services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    command: mini -dir=/data -s3
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null 2>&1']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  seaweedfs-data:
